services:
  postgres:
    image: postgres:16-alpine
    container_name: sweetshop-db
    environment:
      POSTGRES_DB: sweetshop
      POSTGRES_USER: sweetshop
      POSTGRES_PASSWORD: sweetshop123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweetshop -d sweetshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sweetshop-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/sweetshop
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sweetshop
      DB_USERNAME: sweetshop
      DB_PASSWORD: sweetshop123
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-must-be-at-least-256-bits-long-for-hs256}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:8080/api/v1/files}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  adminer:
    image: adminer
    container_name: sweetshop-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads_data:
