name: Customer App CI

on:
  push:
    branches: [main]
    paths: ['customer-app/**']
  pull_request:
    branches: [main]
    paths: ['customer-app/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Customer App (Debug)
        run: ./gradlew :customer-app:assembleDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew :customer-app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :customer-app:lintDebug --no-daemon

      - name: Build Release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: ./gradlew :customer-app:bundleRelease --no-daemon

      - name: Upload Release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-release
          path: customer-app/build/outputs/bundle/release/*.aab
