spring:
  application:
    name: sweetshop-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sweetshop}
    username: ${DB_USERNAME:sweetshop}
    password: ${DB_PASSWORD:sweetshop123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long-for-hs256}
    issuer: sweetshop-api
    audience: sweetshop-clients
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}

  security:
    swagger-enabled: ${SWAGGER_ENABLED:true}

  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/api/v1/files}
    s3-bucket: ${STORAGE_S3_BUCKET:}
    s3-access-key: ${STORAGE_S3_ACCESS_KEY:}
    s3-secret-key: ${STORAGE_S3_SECRET_KEY:}
    s3-endpoint: ${STORAGE_S3_ENDPOINT:}
    s3-region: ${STORAGE_S3_REGION:auto}

  delivery:
    default-charge: 40.00
    free-delivery-threshold: 500.00
    estimated-delivery-days: 3

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

  rate-limit:
    auth-requests-per-minute: ${RATE_LIMIT_AUTH:5}
    api-requests-per-minute: ${RATE_LIMIT_API:60}

  file:
    allowed-types: image/jpeg,image/png,image/webp,image/gif
    max-file-size-mb: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.sweetshop: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
