spring:
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

  security:
    swagger-enabled: false

  rate-limit:
    auth-requests-per-minute: 5
    api-requests-per-minute: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.sweetshop: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    root: INFO
